<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Working Preview</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        h1 { margin-bottom: 20px; }
        button {
            padding: 15px 30px;
            font-size: 18px;
            background: white;
            color: #764ba2;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px;
        }
        button:hover { transform: scale(1.05); }
        #count { font-size: 48px; font-weight: bold; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>✅ Preview is Working!</h1>
        <div id="count">0</div>
        <button onclick="increment()">Click Me</button>
        <button onclick="reset()">Reset</button>
    </div>
    <script>
        let count = 0;
        function increment() {
            count++;
            document.getElementById('count').textContent = count;
        }
        function reset() {
            count = 0;
            document.getElementById('count').textContent = 0;
        }
        setInterval(increment, 2000);
    </script>
</body>
</html>
